version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniops-postgres
    environment:
      POSTGRES_USER: omniops
      POSTGRES_PASSWORD: omniops_dev
      POSTGRES_DB: omniops
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omniops -d omniops']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omniops-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: omniops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: omniops
      RABBITMQ_DEFAULT_PASS: omniops_dev
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: omniops_postgres_data
  redis_data:
    name: omniops_redis_data
  rabbitmq_data:
    name: omniops_rabbitmq_data
